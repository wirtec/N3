name: Nova Tech News – hourly scrape

on:
  schedule:
    # every hour at minute 7 (UTC)
    - cron: "7 * * * *"
    # 1st day of every month 00:02 UTC -> monthly archive rotation, then scrape
    - cron: "2 0 1 * *"
  workflow_dispatch:
    inputs:
      force_archive:
        description: "Force monthly archive rotation now (moves news.json to archive/news-YYYY-MM.json)"
        required: false
        default: "false"
      translate:
        description: "Translate to Persian (1/0)"
        required: false
        default: "1"
      max_new:
        description: "Max new articles per run"
        required: false
        default: "40"

permissions:
  contents: write

concurrency:
  group: nova-news-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # Monthly rotation: news.json -> public/data/archive/news-YYYY-MM.json
      # (the script is idempotent – it only rotates when the month changed)
      - name: Monthly archive rotation
        env:
          FORCE: ${{ github.event.inputs.force_archive == 'true' && '1' || '0' }}
        run: python scraper/archive.py

      - name: Scrape Google News feed
        env:
          TRANSLATE: ${{ github.event.inputs.translate || '1' }}
          MAX_NEW_PER_RUN: ${{ github.event.inputs.max_new || '40' }}
          MAX_TRANSLATE_CHARS: "6000"
        run: python scraper/fetch_news.py

      - name: Rebuild archive index
        run: python scraper/archive.py

      - name: Commit & push
        run: |
          git config user.name "nova-news-bot"
          git config user.email "nova-news-bot@users.noreply.github.com"
          git add public/data
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "chore(news): update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash origin ${GITHUB_REF_NAME}
          git push origin HEAD:${GITHUB_REF_NAME}

  # Optional: notify a deployed web app so it re-imports news.json into PostgreSQL
  notify:
    needs: scrape
    if: ${{ vars.SYNC_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger /api/sync on the deployed site
        run: |
          curl -fsS -X POST "${{ vars.SYNC_URL }}" \
            -H "Authorization: Bearer ${{ secrets.SYNC_TOKEN }}" || true
